experiment_id: "neuropolis-remediated-causal-v3"
random_seed: 42
total_ticks: 8
footprint_profile: "PROTOTYPE_LAPTOP"

experimental_design:
  decision_mode: "LLM_AUTONOMOUS"
  state_channel: "TEXT_AND_STEER"
  steering_method: "OUR_COUPLED_STEER"
  tms_mode: "ENTROPY_TRIGGER"
  randomize_agent_identities: true

orthogonal_clamping:
  omega_d1_scarcity_and_hank: true
  omega_d2_trust_and_parochialism: true
  omega_d3_contagion_and_polarization: true
  omega_d4_fiscal_and_legal_state: true

model_spec:
  backend_type: "WHITE_BOX"
  model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  local_dir: "./models/Qwen--Qwen2.5-1.5B-Instruct"
  auto_download: true
  precision: "float16"
  attn_implementation: "eager"
  max_new_tokens: 96
  temperature: 0.0

steering_spec:
  enabled: true
  mode: "OUR_COUPLED_STEER"
  enable_attn_bias: true
  enable_value_steer: true
  enable_easterbrook_beta: true
  omega_1_drives_finance: 2.20
  omega_2_peer_memory: 1.60
  gamma_periph_suppress: 0.85
  gamma_cynicism_scale: 1.20
  eta_threat_scale: 0.85
  easterbrook_beta_min: 0.85
  easterbrook_beta_max: 1.40
  easterbrook_u_opt: 0.45
  easterbrook_sigma: 0.30
  logit_clamp_max: 6.00
  pasta_alpha: 0.25
  actadd_coeff: 1.15
  hebbian_decay_lambda: 0.35
  hebbian_learning_eta: 0.40

tms_spec:
  enabled: true
  entropy_threshold_tau: 0.46
  probe_tokens_k: 5
  top_p_truncation: 0.90
  communication_cost_xi: 0.05

hank_and_crisis_spec:
  subsistence_min_c: 1.0
  safe_cash_buffer_b: 50.0
  borrowing_limit_ratio_income: -0.42
  liquid_return_rate_rb: 0.002
  borrowing_wedge_kappa: 0.0064
  capital_yield_rate_rk: 0.075
  reference_consumable_price_pc: 12.00
  reference_capital_price_qk: 60.00
  market_clearing_elasticity_phi: 0.18
  kmv_chi_0: 0.075
  kmv_chi_1: 0.526
  kmv_chi_2: 0.736
  kmv_a_min: 0.50
  prod_tfp_baseline_ac: 1.00
  prod_capital_elasticity_eta: 0.25
  present_bias_beta_min: 0.45
  present_bias_eta: 1.35
  long_run_discount_delta: 0.96
  crra_risk_aversion_sigma: 1.50
  default_utility_penalty_phi: 4.00
  latent_signal_specialist_sigma: 0.15
  latent_signal_novice_sigma: 1.80
  active_crisis: "STAGFLATION_SUBSISTENCE_SHOCK"
  crisis_start_tick: 3
  crisis_duration_ticks: 4
  crisis_severity_sigma: 0.35
  crisis_persistence_rho: 0.85

trust_and_market_spec:
