  theil_trust_sensitivity_beta: 0.35
  pg_compliance_trust_beta: 0.25
  scarcity_trust_beta: 0.30
  inst_trust_spillover_beta: 0.20
  familiarity_decay_lambda_n: 0.45
  seller_base_margin_mu: 0.20
  distrust_risk_premium_phi: 0.35
  partner_match_trust_beta: 2.50
  partner_match_surplus_beta: 1.80

contagion_and_opinion_spec:
