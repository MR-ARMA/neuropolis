experiment_id: "neuropolis-v2-endogenous-repe-cda"
master_seed: 42
num_agents: 24
burn_in_ticks: 10
active_ticks: 50
policy_mode: "LLM_AGENT"

factorial_cell:
  cell_id: "C111"
  deliberation_bottleneck: true
  memory_friction: true
  endogenous_repe: true
  repe_mode: "ENDOGENOUS_PROBE_GATED"
  policy_mode: "LLM_AGENT"

model:
  model_id: "meta-llama/Llama-3.1-8B-Instruct"
  revision: "main"
  local_dir: "./models/meta-llama--Llama-3.1-8B-Instruct"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  compute_dtype: "float16"
  attn_implementation: "sdpa"
  temperature: 0.70
  top_p: 0.95
  max_json_retries: 3

economy:
  liquid_return_rate_rb: 0.002
  borrowing_wedge_kappa: 0.008
  borrowing_limit_income_multiple: -0.50
  capital_return_rate_rk: 0.015
  capital_unit_par_value: 50.0
  kmv_chi_0: 0.075
  kmv_chi_1: 0.526
  kmv_chi_2: 0.736
  kmv_a_min: 0.50
  subsistence_min_c: 1.0
  health_decay_per_missing_unit: 0.18
  health_recovery_per_surplus_tick: 0.06
  health_productivity_floor: 0.35
  baseline_tfp_a_c: 1.0
  sales_tax_rate: 0.05
  initial_firm_sector_cash: 50000.0
  initial_intermediary_cash: 25000.0
  initial_treasury_cash: 5000.0

cda:
  tick_size: 0.05
  min_order_price: 0.50
  max_order_price: 500.00
  max_order_quantity: 25.0
  order_ttl_ticks: 3
  enable_capital_secondary_book: true

deliberation:
  enabled: true
  stress_activation_threshold: 0.0
  cot_max_tokens_calm: 128
  cot_min_tokens_stressed: 24
  stress_decay_steepness: 3.5
  action_json_max_tokens: 128

memory_friction:
  enabled: true
  stress_activation_threshold: 0.0
  top_k_calm: 8
  top_k_stressed: 2
  similarity_noise_sigma_max: 0.35
  recency_salience_weight: 0.30
  max_episodic_capacity: 256
  embedding_model_name: "BAAI/bge-small-en-v1.5"
  embedding_dim: 384

repe:
  enabled: true
  mode: "ENDOGENOUS_PROBE_GATED"
  concept_name: "perceived_inequity"
  target_layer: 16
  steering_strength_gamma: 4.50
  probe_pooling: "early_appraisal_cot"
  appraisal_window_tokens: 20
  gate_activation: "sigmoid_centered"
  probe_threshold_theta: 0.0
  probe_temperature: 1.0
  max_relative_norm_ratio: 0.25
  probe_artifact_path: "artifacts/probes/inequity_probe_l16.pt"
  min_contrastive_pairs: 240

shock:
  shock_type: "TFP_SUBSISTENCE_CONTRACTION"
  start_tick: 20
  duration_ticks: 15
  severity_sigma: 0.35
  persistence_rho: 0.85

stats:
  num_economy_seeds_m: 30
  bootstrap_resamples_b: 10000
  alpha_level: 0.05
  min_observations_per_bin: 30
  multiplicity_correction: "holm_bonferroni"
  sesoi_ultimatum_bin_diff: 0.08
  sesoi_whtm_share: 0.05
  sesoi_mpc_bin_diff: 0.06